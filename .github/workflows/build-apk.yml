name: build-apk
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/build-apk.yml', 'icon-512.png']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create Android project
        run: |
          mkdir -p /tmp/app/www && cd /tmp/app
          npm init -y >/dev/null
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cp "$GITHUB_WORKSPACE"/index.html "$GITHUB_WORKSPACE"/icon-192.png www/
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "ir.edrisi.signal",
            "appName": "Signal",
            "webDir": "www",
            "backgroundColor": "#060a13",
            "server": { "url": "https://edri3i.github.io/Signal/", "cleartext": false, "allowNavigation": ["edri3i.github.io"] }
          }
          JSON
          npx cap add android
          # launcher icon
          for d in android/app/src/main/res/mipmap-*; do
            case "$d" in *anydpi*) rm -rf "$d"; continue;; esac
            cp "$GITHUB_WORKSPACE/icon-512.png" "$d/ic_launcher.png"
            cp "$GITHUB_WORKSPACE/icon-512.png" "$d/ic_launcher_round.png"
            cp "$GITHUB_WORKSPACE/icon-512.png" "$d/ic_launcher_foreground.png"
          done
          sed -i 's/android:allowBackup="true"/android:allowBackup="true" android:usesCleartextTraffic="false"/' android/app/src/main/AndroidManifest.xml
      - name: Build debug APK
        working-directory: /tmp/app/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp /tmp/app/android/app/build/outputs/apk/debug/app-debug.apk Signal.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk Signal.apk --title "Signal (Android)" --notes "Debug-signed APK. Install, allow unknown sources if asked."
