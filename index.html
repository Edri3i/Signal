<!DOCTYPE html>
<html lang="fa" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050914">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Signal">
<meta name="description" content="Signal: رادار سیگنال بازارهای مالی">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Signal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#050914;--edge:rgba(120,160,255,.17);--tx:#e6edff;--mut:#7f8db3;--g:#19e3a1;--r:#ff4d6d;--a:#ffc857;--gold:#ffe9a8;--num:"Segoe UI",Roboto,system-ui,sans-serif;--panel:rgba(7,13,32,.76)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,"Segoe UI",system-ui,sans-serif;font-size:13px;line-height:1.5;overscroll-behavior:none}
body{background:radial-gradient(1100px 650px at 50% 46%,#0c1840 0,#060b1c 55%,#050914 100%)}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
#fx{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;pointer-events:none}
#app{position:fixed;inset:0;z-index:1;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
body.lock{overflow:hidden}

/* header */
header{grid-row:1;position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px 6px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.logo{width:34px;height:34px;border-radius:10px;display:block;box-shadow:0 0 0 1px rgba(255,255,255,.14),0 0 20px rgba(110,130,255,.45)}
.brand b{font-family:var(--num);font-size:19px;font-weight:800;letter-spacing:.02em}
.credit{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--num);font-size:10.5px;letter-spacing:.16em;color:var(--mut);white-space:nowrap}
.credit b{font-weight:700;background:linear-gradient(90deg,#38d4ff,#8b7bff,#19e3a1);-webkit-background-clip:text;background-clip:text;color:transparent}
.hr{display:flex;align-items:center;gap:8px}
.pill{display:flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;border:1px solid var(--edge);background:rgba(10,18,44,.7);font-size:11.5px;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--mut)}
.pill.live i{background:var(--g);box-shadow:0 0 9px var(--g)}
.pill.cached i,.pill.demo i{background:var(--a);box-shadow:0 0 9px var(--a)}
.ham{width:38px;height:38px;border-radius:12px;border:1px solid var(--edge);background:rgba(10,18,44,.7);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4.5px;padding:0}
.ham span{display:block;width:17px;height:2px;border-radius:2px;background:var(--tx)}
#banner{grid-row:2;display:none;margin:0 12px 6px;padding:7px 12px;border-radius:12px;border:1px solid rgba(255,200,87,.35);background:rgba(255,200,87,.08);color:#ffe3a3;font-size:12px;direction:rtl;align-items:center;justify-content:space-between;gap:10px}
#banner.on{display:flex}
.btn{border:1px solid var(--edge);background:rgba(255,255,255,.07);padding:6px 13px;border-radius:11px;font-size:12px}
.btn.p{background:linear-gradient(135deg,#8b7bff,#38d4ff);border:0;color:#06101f;font-weight:600}

/* pages */
#pages{grid-row:3;position:relative;min-height:0}
.page{display:none;position:absolute;inset:0;min-height:0}
.page.on{display:block}
#pgNet.on{display:grid}
#pgNet{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr)}
main{display:grid;grid-template-columns:clamp(190px,19vw,250px) minmax(0,1fr) clamp(250px,24vw,310px);grid-template-areas:"left stage right";gap:14px;padding:0 12px 8px;min-height:0}
#left{grid-area:left;display:flex;flex-direction:column;gap:2px;min-height:0}
#stage{grid-area:stage;position:relative;min-width:0;min-height:0;background:radial-gradient(closest-side at 50% 52%,rgba(70,110,255,.22),rgba(60,80,220,.08) 60%,rgba(60,80,220,0) 100%)}
#right{grid-area:right;display:flex;flex-direction:column;min-height:0;border:1px solid var(--edge);border-radius:14px;background:var(--panel)}
.lh{font-size:11px;color:var(--mut);padding:0 2px 4px;flex:none;letter-spacing:.02em}
.src{flex:1 1 0;min-height:0;position:relative;border-left:2px solid var(--c);padding:3px 4px 4px 11px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(90deg,rgba(255,255,255,.03),rgba(255,255,255,0) 70%);border-top:1px solid rgba(255,255,255,.06)}
.srow{display:flex;justify-content:space-between;align-items:baseline;direction:rtl;gap:6px}
.sn{font-size:12.5px;font-weight:600}
.sv{font-family:var(--num);font-size:12.5px;font-weight:800;color:var(--c);direction:rtl;white-space:nowrap}
.ssub{font-size:10px;color:var(--mut);direction:rtl;text-align:right}
.spark{height:24px;flex:none}
#cap{position:absolute;top:0;left:0;right:0;text-align:center;font-size:11px;color:var(--mut);pointer-events:none;direction:rtl;line-height:1.7}
#cap b{font-family:var(--num);color:var(--tx);font-weight:700}
#legend{position:absolute;bottom:2px;left:0;right:0;display:flex;gap:4px 14px;justify-content:center;flex-wrap:wrap;font-size:10.5px;color:var(--mut);pointer-events:none}
#legend span{display:flex;align-items:center;gap:5px;direction:rtl}
#legend i{width:7px;height:7px;border-radius:50%;display:block}
#legend b{font-family:var(--num);color:var(--tx);font-weight:700}

/* top-20 list */
.rh{display:flex;justify-content:space-between;align-items:center;padding:9px 13px 7px;font-size:13px;font-weight:800;flex:none;direction:rtl}
.rh span{color:var(--mut);font-weight:400;font-size:11px}
#list{position:relative;flex:1 1 0;min-height:0;overflow-y:auto;overflow-x:hidden;padding:0 8px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#list::-webkit-scrollbar{display:none}
#inner{position:relative}
.row{position:absolute;left:0;right:0;top:0;height:var(--rh,28px);display:grid;grid-template-columns:8px 54px 32px 22px minmax(0,1fr) auto;align-items:center;gap:7px;padding:0 10px;border-radius:9px;border:1px solid rgba(255,255,255,.07);background:linear-gradient(90deg,var(--tint,rgba(56,212,255,.14)),rgba(18,30,64,.62) 68%);direction:ltr;cursor:pointer;transition:transform .9s cubic-bezier(.22,.8,.2,1),opacity .6s ease,border-color .5s ease,box-shadow .5s ease;will-change:transform,opacity}
.row[style*="opacity: 0"]{pointer-events:none}
.row.hot{border-color:var(--cc);box-shadow:0 0 14px -2px var(--cc)}
.cd{width:8px;height:8px;border-radius:50%;display:block}
.tk{font-family:var(--num);font-weight:800;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dr{font-size:10.5px;font-weight:600;text-align:center;border-radius:99px;padding:0 4px;line-height:17px;direction:rtl}
.dr.L{color:var(--g);background:rgba(25,227,161,.13)}
.dr.S{color:var(--r);background:rgba(255,77,109,.13)}
.sc{font-family:var(--num);font-style:normal;font-weight:700;font-size:11.5px;text-align:right;color:var(--mut)}
.bar{display:block;height:4px;border-radius:3px;background:rgba(255,255,255,.09);overflow:hidden;text-decoration:none}
.bar s{display:block;height:100%;width:100%;transform-origin:left center;transform:scaleX(.3);transition:transform .9s ease;border-radius:3px;text-decoration:none}
.pr{font-family:var(--num);font-weight:800;font-size:12.5px;color:var(--gold);text-align:right;white-space:nowrap}

/* bottom nav */
#nav{grid-row:4;display:flex;justify-content:center;gap:6px;padding:4px 10px calc(6px + env(safe-area-inset-bottom));border-top:1px solid var(--edge);background:rgba(5,9,20,.86)}
.nb{flex:1;max-width:240px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 4px 3px;border:0;background:none;color:var(--mut);font-size:11px;position:relative;border-radius:12px}
.nb svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nb.on{color:#fff}
.nb.on:after{content:"";position:absolute;top:-5px;left:24%;right:24%;height:2px;border-radius:2px;background:linear-gradient(90deg,#38d4ff,#8b7bff,#19e3a1);box-shadow:0 0 10px #8b7bff}
.nb .bd{position:absolute;top:1px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--r);color:#fff;font-size:10px;line-height:16px;text-align:center;padding:0 4px;display:none;font-family:var(--num)}
.nb .bd.on{display:block}

/* generic page frame */
.pg-in{height:100%;max-width:880px;margin:0 auto;padding:0 12px 8px;display:flex;flex-direction:column;min-height:0;position:relative}
.fh{padding:2px 0 6px;display:flex;flex-direction:column;gap:6px;flex:none}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;direction:rtl;padding:1px 0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:5px 13px;border-radius:99px;border:1px solid var(--edge);background:rgba(10,18,44,.6);color:var(--mut);font-size:12px}
.chip.on{background:rgba(139,123,255,.2);border-color:rgba(139,123,255,.6);color:#fff}
.chips.sm .chip{padding:3px 11px;font-size:11.5px}
.scroll{flex:1 1 0;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:10px;border-radius:14px}
.newpill{position:absolute;top:84px;left:50%;transform:translateX(-50%);z-index:5;display:none;padding:5px 14px;border-radius:99px;background:linear-gradient(135deg,#8b7bff,#38d4ff);color:#06101f;font-weight:700;font-size:12px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.newpill.on{display:block}
.empty{padding:34px 16px;text-align:center;color:var(--mut);font-size:13px;direction:rtl}

/* live feed */
.ev{display:flex;gap:11px;align-items:flex-start;padding:10px 12px;margin-bottom:6px;border:1px solid rgba(255,255,255,.06);border-radius:13px;background:rgba(10,18,44,.6);direction:rtl;cursor:pointer}
.ev.new{animation:evin .5s ease}
@keyframes evin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.edot{flex:none;width:9px;height:9px;border-radius:50%;margin-top:8px;background:currentColor;box-shadow:0 0 10px currentColor}
.eb{flex:1;min-width:0}
.et{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.et b{font-family:var(--num);font-size:14px}
.tag{font-size:10.5px;padding:0 8px;border-radius:99px;background:rgba(255,255,255,.07);color:var(--mut);line-height:18px}
.ex{font-size:12.5px;color:#cdd7f2;margin-top:2px}
.etime{flex:none;text-align:left;direction:ltr;font-family:var(--num);font-size:11px;color:var(--mut);line-height:1.5}

/* history */
.hstats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px;direction:rtl;flex:none}
.hs{padding:7px 8px;border-radius:12px;border:1px solid var(--edge);background:rgba(10,18,44,.6);text-align:center}
.hs small{display:block;color:var(--mut);font-size:10.5px}
.hs b{font-family:var(--num);font-size:15px}
.dh2{position:sticky;top:0;z-index:2;padding:6px 4px;font-size:12px;color:var(--mut);background:linear-gradient(#060b1c 70%,rgba(6,11,28,0));direction:rtl}
.hc{margin-bottom:8px;padding:11px 12px;border:1px solid rgba(255,255,255,.07);border-radius:15px;background:rgba(10,18,44,.62);direction:rtl;cursor:pointer}
.hc.L{box-shadow:inset -3px 0 0 var(--g)}
.hc.S{box-shadow:inset -3px 0 0 var(--r)}
.hh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hh b.sym{font-family:var(--num);font-size:15px}
.bdg{font-size:11px;font-weight:600;padding:0 9px;border-radius:99px;line-height:19px}
.bdg.L{color:var(--g);background:rgba(25,227,161,.13)}
.bdg.S{color:var(--r);background:rgba(255,77,109,.13)}
.bdg.n{color:var(--a);background:rgba(255,200,87,.12)}
.st{margin-inline-start:auto;font-size:11.5px;font-weight:700;padding:0 10px;border-radius:99px;line-height:20px}
.st.open{color:#7fd7ff;background:rgba(56,212,255,.13)}
.st.t1,.st.t2{color:var(--g);background:rgba(25,227,161,.14)}
.st.stop{color:var(--r);background:rgba(255,77,109,.14)}
.st.expired{color:var(--mut);background:rgba(255,255,255,.07)}
.hw{font-size:11.5px;color:var(--mut);margin:4px 0 8px}
.hg{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
@media(min-width:560px){.hg{grid-template-columns:repeat(4,1fr)}}
.hg div{padding:7px 9px;border-radius:11px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.05)}
.hg small{display:block;color:var(--mut);font-size:10.5px}
.hg b{font-family:var(--num);font-size:13px;display:block;direction:ltr;text-align:right}
.hg em{display:block;font-style:normal;font-size:10.5px;color:var(--mut)}
.hl{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:11.5px;color:var(--mut)}
.hl span b{font-family:var(--num);color:var(--tx);font-weight:700}
.hl .ok{color:var(--g)}.hl .bad{color:var(--r)}
.up{color:var(--g)}.dn{color:var(--r)}

/* drawer */
#scrim{position:fixed;inset:0;background:rgba(2,5,12,.66);opacity:0;pointer-events:none;transition:opacity .3s;z-index:40}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;bottom:0;right:0;width:min(94vw,430px);background:#0a1020;border-left:1px solid var(--edge);transform:translateX(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);z-index:50;display:flex;flex-direction:column;direction:rtl}
#drawer.on{transform:none}
.dhd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--edge)}
.dhd h3{margin:0;font-size:16px}
.x{width:36px;height:36px;border-radius:12px;border:1px solid var(--edge);background:rgba(255,255,255,.05);font-size:18px}
.dbd{overflow:auto;padding:10px 12px 40px;flex:1}
details{border:1px solid var(--edge);border-radius:14px;margin-bottom:8px;background:rgba(255,255,255,.025)}
summary{padding:12px 14px;cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary:after{content:"‹";transition:.2s;color:var(--mut)}
details[open] summary:after{transform:rotate(-90deg)}
.dc{padding:0 14px 14px;font-size:12.5px}
.note{color:var(--mut);font-size:11.5px;margin:6px 0;line-height:1.8}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{color:var(--mut);font-weight:400;text-align:right;padding:4px 2px}
.tbl td{padding:5px 2px;border-top:1px solid rgba(255,255,255,.06)}
.tbl td.n{font-family:var(--num);direction:ltr;text-align:right}
input[type=text],input[type=date]{width:100%;background:#0d1528;border:1px solid var(--edge);border-radius:10px;color:var(--tx);padding:8px 10px;font:inherit;font-size:12.5px;direction:ltr;margin:4px 0 8px}
input[type=range]{width:100%;accent-color:#8b7bff}
.row2{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:6px 0}
.log{max-height:180px;overflow:auto;font-size:11px;color:var(--mut);direction:ltr;text-align:left;font-family:ui-monospace,monospace;white-space:pre-wrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:6px}

/* detail sheet */
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;background:#0a1020;border:1px solid var(--edge);border-radius:26px 26px 0 0;transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.8,.2,1);z-index:60;overflow:auto;padding:8px 16px calc(28px + env(safe-area-inset-bottom));direction:rtl}
#sheet.on{transform:none}
@media(min-width:800px){#sheet{left:50%;right:auto;width:660px;margin-left:-330px}}
.grab{width:44px;height:5px;border-radius:5px;background:rgba(255,255,255,.2);margin:6px auto 12px}
.shd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
.shd .sym{font-family:var(--num);font-size:21px;font-weight:800}
.big{display:flex;gap:14px;align-items:center}
.ring{--p:50;--c:var(--g);width:74px;height:74px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),rgba(255,255,255,.08) 0);display:grid;place-items:center;position:relative;flex:none}
.ring:after{content:"";position:absolute;inset:6px;border-radius:50%;background:#0b1222}
.ring b{position:relative;z-index:2;font-size:22px;font-weight:800;font-family:var(--num)}
.fr{margin:10px 0}
.fr .t{display:flex;justify-content:space-between;gap:10px;font-size:12.5px}
.fr .t span:last-child{color:var(--mut);font-size:11.5px;text-align:left;direction:rtl}
.fr .b{height:6px;border-radius:4px;background:rgba(255,255,255,.08);margin-top:4px;overflow:hidden;position:relative}
.fr .b u{position:absolute;top:0;bottom:0;border-radius:4px;text-decoration:none}
.lvg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.lvg div{padding:9px 10px;border-radius:14px;border:1px solid var(--edge);background:rgba(255,255,255,.03);text-align:center}
.lvg small{display:block;color:var(--mut);font-size:11px}
.lvg b{font-family:var(--num);font-size:13px;direction:ltr;display:block}
.warn{padding:9px 12px;border-radius:12px;background:rgba(255,154,92,.1);border:1px solid rgba(255,154,92,.35);color:#ffc9a3;font-size:12.5px;margin:10px 0}
.pchart{width:100%;height:150px;display:block;border-radius:14px;background:rgba(255,255,255,.025);border:1px solid var(--edge)}
.liqc{width:100%;height:230px;display:block;border-radius:14px;background:rgba(255,255,255,.025);border:1px solid var(--edge)}
.sec{margin:14px 0 6px;font-size:13.5px;font-weight:800}

/* portrait phone */
@media (max-aspect-ratio:1/1){
 main{grid-template-columns:100px minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,43%);grid-template-areas:"left stage" "right right";gap:8px;padding:0 8px 6px}
 .lh{display:none}
 .ssub{display:none}
 .srow{flex-direction:column;align-items:flex-end;gap:0}
 .sn{font-size:11px;line-height:1.3}.sv{font-size:11px;line-height:1.3}
 .spark{height:12px}
 .src{padding:2px 3px 3px 7px}
 #cap{font-size:10px}
 .credit{font-size:9.5px;letter-spacing:.1em}
 .brand b{font-size:17px}
 #legend{font-size:10px;gap:2px 10px}
 .hstats{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="app">
  <header>
    <div class="brand"><img class="logo" src="icon-192.png" alt="" width="34" height="34"><b>Signal</b></div>
    <div class="credit" dir="ltr">Written by <b>Ali Edrisi</b></div>
    <div class="hr"><div class="pill" id="pill"><i></i><span id="pillTx">در حال اتصال</span></div><button class="ham" id="menuBtn" aria-label="منو"><span></span><span></span><span></span></button></div>
  </header>
  <div id="banner"><span id="bannerTx"></span><button class="btn" id="retry">تلاش دوباره</button></div>
  <div id="pages">
    <section class="page on" id="pgNet">
      <main>
        <aside id="left"><div class="lh">ورودی‌های اصلی داده</div></aside>
        <section id="stage"><div id="cap"></div><div id="legend"></div></section>
        <aside id="right"><div class="rh"><b>برترین ۲۰ امتیاز</b><span>مرتب‌شده زنده</span></div><div id="list"><div id="inner"></div></div></aside>
      </main>
    </section>
    <section class="page" id="pgFeed">
      <div class="pg-in">
        <div class="fh"><div class="chips" id="feedCats"></div><div class="chips sm" id="feedTys"></div></div>
        <button class="newpill" id="feedNew">↑ رویداد جدید</button>
        <div class="scroll" id="feedList"></div>
      </div>
    </section>
    <section class="page" id="pgHist">
      <div class="pg-in">
        <div class="hstats" id="histStats"></div>
